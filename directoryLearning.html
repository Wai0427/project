<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JavaScript Learning Directory</title>
  <link rel="stylesheet" href="css/dir-learn.css" />
</head>
<body>
  <p class="title-page">Directory</p>

  <div class="section-container">
        <section class="yt-section">
        <p>1. YouTube Subscribe Button</p>
        <button class="yt-btn" onclick="subscribeYT();">
        Subscribe
        </button>
    </section>

    <section class="cost-calculator">
        <p>
        2. E-commerce Shipping Calculator <br/>
        Orders under $40 = +$10 Shipping Fee<br/>
        Orders over $40 = Free Shipping Fee
        </p>

        <div class="cost-row">
        <input 
            type="number" 
            min="1" 
            class="userOrder" 
            oninput="this.value = this.value < 1 ? 1 : this.value" 
            onkeydown="enterCalculation(event);" 
            placeholder="Enter your cost here"
        />
        <button class="calc-btn" onclick="totalCostOfOrder();">
            Calculate
        </button>
        </div>

        <p class="totalCost"></p>
    </section>

    <section class="rps-games">
        <p>3. (GAMES) - Rock Paper Scissors</p>
        <a class="rps-btn" href="project/rockPaperScissor.html">
        RPS games
        </a>
    </section>

    <section class="todo">
        <p>4. To-do List</p>
        <a class="rps-btn" href="./project/to-do-list.html">To-do List Page</a>
    </section>

    <section class="drumkit-section">
        <p>5. Drumkit Project</p>
        <a class="rps-btn" href="./project/drumkit.html">Drumkit Page</a>
    </section>

    <section class="ecommerce-project">
        <p>6. Ecommerce Project</p>
        <a class="rps-btn" href="./project/ecommerce/ecommerce.html">Ecommerce Page</a>
    </section>
  </div>
  

  <div class="main-page">
    <a href="/">
      <button>Profile Page</button>
    </a>
  </div>

  <script src="scripts/dir-learn.js"></script>
</body>
</html>
