<!DOCTYPE html>
<html>
  <head>
    <title>Checkout</title>

    <!-- This code is needed for responsive design to work.
      (Responsive design = make the website look good on
      smaller screen sizes like a phone or a tablet). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Load a font called Roboto from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Here are the CSS files for this page. -->
    <link rel="stylesheet" href="../../css/ecom-style/shared/general.css">
    <link rel="stylesheet" href="../../css/ecom-style/pages/checkout/checkout-header.css">
    <link rel="stylesheet" href="../../css/ecom-style/pages/checkout/checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
  <body>
    <div class="checkout-header">
      <div class="header-content">
        <div class="checkout-header-left-section">
          <a href="ecommerce.html">
            <p class="ecommerce-logo1">
              E-commerce
            </p>
            <p class="ecommerce-mobile-logo">
              <i class="fa fa-shopping-cart" aria-hidden="true"></i>
            </p>
          </a>
        </div>

        <div class="checkout-header-middle-section">
          Checkout (<a class="js-return-to-home-link return-to-home-link"
            href="ecommerce.html"> items</a>)
        </div>

        <div class="checkout-header-right-section">
          <img src="../../images/ecommerce/icons/checkout-lock-icon.png">
        </div>
      </div>
    </div>

    <div class="main">
      <div class="page-title">Review your order</div>

      <div class="checkout-grid">
        <div class="order-summary js-order-summary">
        </div>

        <div class="payment-summary js-payment-summary">
        </div>
      </div>
    </div>

    <script type="module" src="../../scripts/ecom-script/checkout.js"></script>
  </body>
</html>
