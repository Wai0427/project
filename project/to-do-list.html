<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="../css/to-do.css">
</head>
<body>
    <div class="title-section">
        <p class="todo-title">To-do List</p>
        <img src="../images/todo/todo.png" alt="to-do" class="todo-img">
    </div>
    
    <div class="todo-content">
        <div class="input-section">
            <input placeholder="Add your task" class="todo-input">
            <input type="date" class="todo-date">

            <button class="add-button">+</button>
        </div>

        <div class="list-container">
            <div class="todo-subcontent">
                <div class="task"></div>
            </div>
        </div>
    </div>

    <a href="../directoryLearning.html">
        <button class="todo-back">Back to Main</button>
    </a> 

    <script src="../scripts/todo.js"></script>
</body>
</html>
